<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | Vibelink</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0095f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">Vibelink</a>
            
            <div class="nav-links">
                <a href="index.html" class="nav-icon">
                    <svg aria-label="Home" fill="currentColor" height="24" viewBox="0 0 24 24" width="24"><path d="M22 23h-6.001a1 1 0 0 1-1-1v-5.455a2.997 2.997 0 1 0-5.993 0V22a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V11.543a1.002 1.002 0 0 1 .31-.724l10-9.543a1.001 1.001 0 0 1 1.38 0l10 9.543a1.002 1.002 0 0 1 .31.724V22a1 1 0 0 1-1 1Z" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="2"></path></svg>
                </a>
                <div class="nav-icon nav-avatar" onclick="window.location.href='profile.html'" id="navAvatar">U</div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="profile-container">
            <!-- Header -->
            <div class="profile-header">
                <div class="profile-avatar-large">
                    <div class="profile-avatar-circle" id="profileAvatar">U</div>
                </div>
                <div class="profile-info">
                    <div class="profile-title-row">
                        <h1 class="profile-username" id="profileName">loading...</h1>
                        <button id="followBtn" class="btn hidden" style="width: auto;">Follow</button>
                    </div>
                    <div class="profile-stats">
                        <div class="profile-stat"><span id="statPosts">0</span> posts</div>
                        <div class="profile-stat"><span id="statFollowers">0</span> followers</div>
                        <div class="profile-stat"><span id="statFollowing">0</span> following</div>
                    </div>
                </div>
            </div>

            <!-- Grid -->
            <div class="profile-tabs">
                <div class="profile-tab active">
                    <svg aria-label="" fill="currentColor" height="12" viewBox="0 0 24 24" width="12"><rect fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" width="18" x="3" y="3"></rect><line fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" x1="9.015" x2="9.015" y1="3" y2="21"></line><line fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" x1="14.985" x2="14.985" y1="3" y2="21"></line><line fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" x1="21" x2="3" y1="9.015" y2="9.015"></line><line fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" x1="21" x2="3" y1="14.985" y2="14.985"></line></svg>
                    POSTS
                </div>
            </div>

            <div id="feed" class="profile-grid">
                <!-- Grid items injected via JS -->
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!isAuthenticated()) {
                window.location.href = 'login.html';
                return;
            }
            
            const user = getCurrentUser();
            if (user) {
                document.getElementById('navAvatar').textContent = user.username.charAt(0).toUpperCase();
            }

            const urlParams = new URLSearchParams(window.location.search);
            const targetUserId = urlParams.get('id') || user.id;

            loadProfile(targetUserId);
            loadUserPosts(targetUserId);
        });
    </script>
</body>
</html>
